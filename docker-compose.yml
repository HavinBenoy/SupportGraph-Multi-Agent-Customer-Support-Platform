services:
  db:
    # pgvector/pgvector is the official Postgres image with the `vector` extension pre-installed.
    image: pgvector/pgvector:pg16
    container_name: supportgraph-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportgraph}
      POSTGRES_DB: ${POSTGRES_DB:-supportgraph}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts in this folder run once, on first container start (empty data dir).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supportgraph} -d ${POSTGRES_DB:-supportgraph}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
