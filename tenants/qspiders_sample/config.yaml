# Per-tenant settings. Loaded into the `tenants` table by scripts/seed_store.py.
#
# SAMPLE DEPLOYMENT: this tenant is modelled on a training institute (QSpiders / PySpiders) but every number below
# and every document under docs/ is clearly-labelled sample content, not the institute's real policy.
# Replace it with the institute's approved material before any real use. `is_sample: true` makes the demo
# tools and the FAQ bot say so out loud.
# The attendance threshold in docs/ must agree with this value (tests enforce it).
tenant_id: qspiders_sample
name: QSpiders / PySpiders (sample deployment)
timezone: Asia/Kolkata
attendance_threshold_pct: 75
is_sample: true
# Query expansion vocabulary (sample): what students say -> what the help articles say.
query_synonyms:
  course: [programme, programmes]
  courses: [programme, programmes]
  marks: [score, scores, result]
  mark: [score, result]
  fee: [fees]
  price: [fee, fees]
  cost: [fee, fees]
  job: [placement]
  jobs: [placement]
  discount: [concession]
  certificate: [certification]

# Build step 4 (SAMPLE values: replace with the institute's real routing and targets)
makeup_window_days: 14
default_team: student-support
escalation_teams:
  complaint: student-experience
  payment_dispute: accounts
  concession_request: accounts
  legal_threat: management
  safety: management
  human_request: student-support
  makeup_request: academics
sla_hours: {low: 72, medium: 48, high: 24, urgent: 4}
