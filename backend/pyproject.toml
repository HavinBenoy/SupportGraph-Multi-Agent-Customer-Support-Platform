[project]
name = "supportgraph"
version = "0.1.0"
description = "Multi-tenant customer support platform run by LangGraph agents"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "langfuse>=5,<6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyyaml>=6",  # imported at runtime by app/tenants/loader.py (tenant config), not just by tests
    "langgraph-checkpoint-postgres>=2.0",  # persistent checkpointer for paused runs (build step 4)
    "fastapi>=0.110",  # HTTP API for the frontend (build step 5)
    "uvicorn[standard]>=0.29",
    "pgvector>=0.3",  # vector column type + distance operators for SQLAlchemy (build step 2)
]

[project.optional-dependencies]
# Providers are optional so the core installs fast and tests need no network.
ollama = ["langchain-ollama"]
openai = ["langchain-openai"]
bench = ["psutil", "httpx>=0.27"]            # benchmark kit; add faster-whisper / piper-tts only for the optional voice benchmarks
dev = ["pytest>=8", "pyyaml>=6", "httpx>=0.27"]  # httpx: FastAPI TestClient

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs a real Postgres (set SG_TEST_DATABASE_URL); skipped otherwise"]
pythonpath = ["."]
